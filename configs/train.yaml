defaults:
  - data: libero
  - _self_

run:
  stage: seen  # seen or target
  seed: 0
  task_id: null
  budget: null
  init_checkpoint: lerobot/smolvla_base
  output_dir: null

policy:
  action_chunk_size: 50
  action_execution_steps: 1
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true

training:
  seen_steps: 30000
  target_steps: 5000
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  num_workers: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  grad_clip_norm: 10.0
  seen_warmup_steps: 1000
  target_warmup_steps: 250
  log_every_steps: 100
  seen_checkpoint_every_steps: 10000
  target_checkpoint_every_steps: 2500
  keep_last_checkpoints: 2

runtime:
  device: cuda
  model_dtype: float32
  amp_dtype: float16

wandb:
  enabled: false
  project: tlab-libero
  entity: null
